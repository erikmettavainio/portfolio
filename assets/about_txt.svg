<?xml version="1.0" encoding="UTF-8"?>
<svg id="Layer_2" data-name="Layer 2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 819.23 502.29">
  <defs>
    <style>
      .cls-1 {
        font-size: 28.35px;
      }

      .cls-2 {
        font-family: 'bianzhidai_noBG-Ring', bianzhidai_noBG;
      }

      .cls-3 {
        font-family: Helvetica-Light, Helvetica;
        font-weight: 300;
      }
    </style>
  </defs>
  <g id="Layer_1-2" data-name="Layer 1">
    <text class="cls-1" transform="translate(0 29.79)"><tspan class="cls-2" x="0" y="0">ERIK METTÄVAINIO</tspan><tspan class="cls-3" x="335.62" y="0" xml:space="preserve"> (b. 2004) works with recorded and </tspan><tspan class="cls-3"><tspan x="0" y="34.02">synthesised materials to form organic and texturally diverse </tspan></tspan><tspan class="cls-3"><tspan x="0" y="68.03">compositions, largely based on gesture and scale as a mterial </tspan></tspan><tspan class="cls-3"><tspan x="0" y="102.05">itself. Initially trained as a jazz vocalist, he later turned toward </tspan></tspan><tspan class="cls-3"><tspan x="0" y="136.06">electro-acoustic composition through and interest in timbre and </tspan></tspan><tspan class="cls-3"><tspan x="0" y="170.08">dense harmony, often translating vocal phrasings into electronic </tspan></tspan><tspan class="cls-3"><tspan x="0" y="204.09">contexts. His work exhibits themes of nature romanticism and </tspan></tspan><tspan class="cls-3"><tspan x="0" y="238.11">urbanism, and particularly the constructing of identity within and </tspan></tspan><tspan class="cls-3"><tspan x="0" y="272.13">between these contexts.</tspan></tspan><tspan class="cls-3"><tspan x="0" y="340.16">He is currently studing electro-acoustic composition at the </tspan></tspan><tspan class="cls-3"><tspan x="0" y="374.17">Royal College of Music in Stockholm.</tspan></tspan></text>
  </g>
</svg>