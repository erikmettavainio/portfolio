  <g id="Layer_1-2" data-name="Layer 1">
    <text class="cls-1" transform="translate(0 24.35)"><tspan class="cls-2" x="0" y="0">ALKIMIA</tspan><tspan class="cls-3" x="152.56" y="0"> </tspan><tspan class="cls-3"><tspan x="0" y="34.02">(Single, 28 April 2026)</tspan></tspan><tspan class="cls-3"><tspan x="0" y="102.05">Fixed media piece written for 16 </tspan></tspan><tspan class="cls-3"><tspan x="0" y="136.06">channels.</tspan></tspan><tspan class="cls-3"><tspan x="0" y="204.09">Among large FM bells, birdsong, </tspan></tspan><tspan class="cls-3"><tspan x="0" y="238.11">microscopic percussion, zither, </tspan></tspan><tspan class="cls-3"><tspan x="0" y="272.13">modular synthesis and complex </tspan></tspan><tspan class="cls-3"><tspan x="0" y="306.14">clusters of distorted vocals, Alk</tspan><tspan x="395.4" y="306.14">-</tspan></tspan><tspan class="cls-3"><tspan x="0" y="340.16">imia is an imagined soundtrack</tspan><tspan x="395.37" y="340.16">-</tspan></tspan><tspan class="cls-3"><tspan x="0" y="374.17">ing to the protoscientific alchemi</tspan><tspan x="411.19" y="374.17">-</tspan></tspan><tspan class="cls-3"><tspan x="0" y="408.19">cal attempts to obtain gold from </tspan></tspan><tspan class="cls-3"><tspan x="0" y="442.2">common earth metals in medie</tspan><tspan x="390.67" y="442.2">-</tspan></tspan><tspan class="cls-3"><tspan x="0" y="476.22">val times.</tspan></tspan><tspan class="cls-3"><tspan x="0" y="544.25">Read more on</tspan></tspan></text>
  </g>
