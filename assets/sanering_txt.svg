  <g id="Layer_1-2" data-name="Layer 1">
    <text transform="translate(0 24.35)"><tspan class="cls-4"><tspan class="cls-2" x="0" y="0">SANERING</tspan><tspan class="cls-6" x="167.47" y="0"> </tspan></tspan><tspan class="cls-5"><tspan x="0" y="34.02">(Soundtrack and Audio Design)</tspan></tspan><tspan class="cls-5"><tspan x="0" y="102.05">“Erik Mettävainios diskanta musik </tspan></tspan><tspan class="cls-5"><tspan x="0" y="136.06">blir det molande i pjäsen som till</tspan><tspan x="409.51" y="136.06">-</tspan></tspan><tspan class="cls-5"><tspan x="0" y="170.08">sammans med silverfiskarna </tspan></tspan><tspan class="cls-5"><tspan x="0" y="204.09">tycks ta sig fram mellan springor </tspan></tspan><tspan class="cls-5"><tspan x="0" y="238.11">i golvet” (Kult Magasin)</tspan></tspan><tspan class="cls-5"><tspan x="0" y="306.14">Soundtrack for the original drama </tspan></tspan><tspan class="cls-5"><tspan x="0" y="340.16">‘Sanering’ written by Walter </tspan></tspan><tspan class="cls-5"><tspan x="0" y="374.17">Hornfelt: a satirical story about </tspan></tspan><tspan class="cls-5"><tspan x="0" y="408.19">the collective and the private, </tspan></tspan><tspan class="cls-5"><tspan x="0" y="442.21">filth and responsibility.</tspan></tspan><tspan class="cls-5"><tspan x="0" y="510.24">Recorded and realised using the </tspan></tspan><tspan class="cls-5"><tspan x="0" y="544.25">Buchla 200e and SuperCollider </tspan></tspan><tspan class="cls-5"><tspan x="0" y="578.27">systems, guitar, harmonium, per</tspan><tspan x="407.96" y="578.27">-</tspan></tspan><tspan class="cls-5"><tspan x="0" y="612.28">cussion and field recordings.</tspan></tspan><tspan class="cls-1"><tspan x="0" y="673.51">CREDITS:</tspan></tspan><tspan class="cls-3"><tspan x="0" y="700.72">‘Sanering’ written by Walter Hornfelt</tspan></tspan><tspan class="cls-3"><tspan x="0" y="755.15">Performed by Teater Tunga</tspan></tspan><tspan class="cls-3"><tspan x="0" y="782.36">at Esperantoscenen, Gothenburg, 2026</tspan></tspan><tspan class="cls-3"><tspan x="0" y="809.57">Directed by Niels Nevrin Stangertz</tspan></tspan><tspan class="cls-3"><tspan x="0" y="864">Composed, recorded and mixed by Erik </tspan></tspan><tspan class="cls-3"><tspan x="0" y="891.21">Mettävainio at the Royal College of Music </tspan></tspan><tspan class="cls-3"><tspan x="0" y="918.42">in Stockholm, 2025-2026</tspan></tspan><tspan class="cls-3"><tspan x="0" y="972.85">Sound Operation by Alexander Rydberg</tspan></tspan><tspan class="cls-3"><tspan x="0" y="1027.28">Artwork, illustration and cover design by </tspan></tspan><tspan class="cls-3"><tspan x="0" y="1054.49">Elliott Magnusson</tspan></tspan><tspan class="cls-3"><tspan x="0" y="1108.91">‘Sanering’ produced with culture grant </tspan></tspan><tspan class="cls-3"><tspan x="0" y="1136.13">from Göteborgs stad</tspan></tspan><tspan class="cls-3"><tspan x="0" y="1190.55">Thanks to Annelie Nederberg</tspan></tspan></text>
  </g>
