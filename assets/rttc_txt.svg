  <g id="Layer_1-2" data-name="Layer 1">
    <text class="cls-1" transform="translate(0 24.35)"><tspan class="cls-2" x="0" y="0">RETURN TO THE CITY</tspan><tspan class="cls-3" x="352.62" y="0"> </tspan><tspan class="cls-3"><tspan x="0" y="34.02">(EP, 27 June 2025)</tspan></tspan><tspan class="cls-3"><tspan x="0" y="102.05">Using field recordings, found </tspan></tspan><tspan class="cls-3"><tspan x="0" y="136.06">sounds, electronics and vocal </tspan></tspan><tspan class="cls-3"><tspan x="0" y="170.08">arrangements, ‘Return To the </tspan></tspan><tspan class="cls-3"><tspan x="0" y="204.09">City’ explores the dichotomy of </tspan></tspan><tspan class="cls-3"><tspan x="0" y="238.11">modern urbanism.</tspan></tspan><tspan class="cls-3"><tspan x="0" y="306.14">Recorded and realised using the </tspan></tspan><tspan class="cls-3"><tspan x="0" y="340.16">Elektron Digitakt system, field re</tspan><tspan x="406.36" y="340.16">-</tspan></tspan><tspan class="cls-3"><tspan x="0" y="374.17">cordings, choir, violin, accordion </tspan></tspan><tspan class="cls-3"><tspan x="0" y="408.19">and percussion.</tspan></tspan><tspan class="cls-3"><tspan x="0" y="476.22">Read more on</tspan></tspan></text>
  </g>
