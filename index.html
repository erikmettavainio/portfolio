<script>
/* Touching circles with a cursor-driven ordered-dither field. */
const canvas = document.getElementById("gradientBackground");
const ctx = canvas.getContext("2d", { alpha: false });
const DIAMETER = 18; // Change this to 12 for finer dots, 24 for larger dots.
const RADIUS = DIAMETER / 2;
const BAYER = [
  [0, 8, 2, 10],
  [12, 4, 14, 6],
  [3, 11, 1, 9],
  [15, 7, 13, 5]
];
let gridWidth = 0;
let gridHeight = 0;
let columns = 0;
let rows = 0;
let mouseX = 0;
let mouseY = 0;
let targetX = 0;
let targetY = 0;
let pointerActive = false;
let frame = 0;

function resizeCircles() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  gridWidth = window.innerWidth;
  gridHeight = window.innerHeight;
  canvas.width = Math.round(gridWidth * dpr);
  canvas.height = Math.round(gridHeight * dpr);
  canvas.style.width = gridWidth + "px";
  canvas.style.height = gridHeight + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  columns = Math.ceil(gridWidth / DIAMETER) + 1;
  rows = Math.ceil(gridHeight / DIAMETER) + 1;
  if (!pointerActive) {
    mouseX = targetX = gridWidth / 2;
    mouseY = targetY = gridHeight / 2;
  }
}

window.addEventListener("resize", resizeCircles);
window.addEventListener("pointermove", event => {
  targetX = event.clientX;
  targetY = event.clientY;
  pointerActive = true;
});
window.addEventListener("pointerleave", () => { pointerActive = false; });
resizeCircles();

function drawCircles() {
  frame++;
  if (!pointerActive) {
    targetX = gridWidth / 2 + Math.sin(frame * 0.006) * gridWidth * 0.22;
    targetY = gridHeight / 2 + Math.cos(frame * 0.004) * gridHeight * 0.20;
  }
  mouseX += (targetX - mouseX) * 0.09;
  mouseY += (targetY - mouseY) * 0.09;
  ctx.fillStyle = "#ededed";
  ctx.fillRect(0, 0, gridWidth, gridHeight);

  for (let row = 0; row < rows; row++) {
    const cy = RADIUS + row * DIAMETER;
    for (let col = 0; col < columns; col++) {
      const cx = RADIUS + col * DIAMETER;
      const dx = cx - mouseX;
      const dy = cy - mouseY;
      const distance = Math.hypot(dx, dy);
      const influence = Math.max(0, 1 - distance / 260);
      const smooth = influence * influence * (3 - 2 * influence);

      // A 4x4 Bayer threshold makes the mouse field break into ordered dots.
      const threshold = (BAYER[row % 4][col % 4] + 0.5) / 16;
      const dither = smooth > threshold ? 1 : 0;
      const shade = Math.round(196 - dither * 94 - smooth * 12);
      const white = Math.round(250 - dither * 12);
      const direction = Math.atan2(dy, dx) + Math.PI / 2;
      const shift = smooth * RADIUS * 0.7;
      const gx = cx + Math.cos(direction) * shift;
      const gy = cy + Math.sin(direction) * shift;

      const gradient = ctx.createRadialGradient(
        gx - RADIUS * 0.32, gy - RADIUS * 0.32, 0,
        gx, gy, RADIUS * 1.32
      );
      gradient.addColorStop(0, `rgb(${white},${white},${white})`);
      gradient.addColorStop(1, `rgb(${shade},${shade},${shade})`);
      ctx.beginPath();
      ctx.arc(cx, cy, RADIUS, 0, Math.PI * 2);
      ctx.fillStyle = gradient;
      ctx.fill();
    }
  }
  requestAnimationFrame(drawCircles);
}
requestAnimationFrame(drawCircles);

const links = document.querySelectorAll(".nav-link");

/* Wrap visible nav text in letter spans */

links.forEach(link => {
  const textNodes = [];

  const walker = document.createTreeWalker(
    link,
    NodeFilter.SHOW_TEXT,
    null
  );

  while (walker.nextNode()) {
    textNodes.push(walker.currentNode);
  }

  textNodes.forEach(node => {
    const fragment = document.createDocumentFragment();

    [...node.textContent].forEach(char => {
      const span = document.createElement("span");
      span.textContent = char;
      span.className = "font-react-letter";
      fragment.appendChild(span);
    });

    node.replaceWith(fragment);
  });
});

/* Floating/random nav */

const desktopZones = [
  { x: 18, y: 18 },
  { x: 62, y: 18 },
  { x: 14, y: 62 },
  { x: 58, y: 66 },
  { x: 42, y: 82 }
];

const mobileZones = [
  { x: 8, y: 14 },
  { x: 52, y: 18 },
  { x: 10, y: 58 },
  { x: 48, y: 64 },
  { x: 28, y: 82 }
];

function shuffle(array) {
  return array.sort(() => Math.random() - 0.5);
}

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

const isMobile = window.innerWidth <= 700;
const activeZones = isMobile ? mobileZones : desktopZones;
const shuffledZones = shuffle([...activeZones]);

if (isMobile) {
  links.forEach((link, index) => {
    const zone = shuffledZones[index];

    const x = zone.x + (Math.random() * 8 - 4);
    const y = zone.y + (Math.random() * 6 - 3);

    link.style.left = x + "vw";
    link.style.top = y + "vh";
    link.style.transform = "none";
  });
} else {
  const movers = [];

  links.forEach((link, index) => {
    const zone = shuffledZones[index];

    const x = (zone.x + (Math.random() * 12 - 6)) / 100 * window.innerWidth;
    const y = (zone.y + (Math.random() * 10 - 5)) / 100 * window.innerHeight;

    movers.push({
      element: link,
      x,
      y,
      vx: (Math.random() - 0.5) * 0.25,
      vy: (Math.random() - 0.5) * 0.25,
      rotation: Math.random() * 8 - 4,
      vr: (Math.random() - 0.5) * 0.025
    });
  });

  function animate() {
    movers.forEach(item => {
      const rect = item.element.getBoundingClientRect();

      item.x += item.vx;
      item.y += item.vy;
      item.rotation += item.vr;

      if (item.x <= 0 || item.x + rect.width >= window.innerWidth) {
        item.vx *= -1;
      }

      if (item.y <= 0 || item.y + rect.height >= window.innerHeight) {
        item.vy *= -1;
      }

      item.x = clamp(item.x, 0, window.innerWidth - rect.width);
      item.y = clamp(item.y, 0, window.innerHeight - rect.height);

      item.element.style.left = item.x + "px";
      item.element.style.top = item.y + "px";
      item.element.style.transform = `rotate(${item.rotation}deg)`;
    });

    requestAnimationFrame(animate);
  }

  animate();
}

/* Font-react cursor effect */

const letters = document.querySelectorAll(".font-react-letter");
const radius = 70;
const reactiveFontClasses = ["touched-bianzhidai", "touched-anthony"];

document.addEventListener("mousemove", e => {
  letters.forEach(letter => {
    const rect = letter.getBoundingClientRect();

    const dx = e.clientX - (rect.left + rect.width / 2);
    const dy = e.clientY - (rect.top + rect.height / 2);
    const distance = Math.hypot(dx, dy);
    const isTouched = distance < radius;

    if (isTouched && !letter.dataset.reactiveFont) {
      const chosenClass = Math.random() < 0.5
        ? "touched-bianzhidai"
        : "touched-anthony";

      letter.dataset.reactiveFont = chosenClass;
      letter.classList.add(chosenClass);
    }

    if (!isTouched && letter.dataset.reactiveFont) {
      letter.classList.remove(letter.dataset.reactiveFont);
      delete letter.dataset.reactiveFont;
    }
  });
});

/* Click invert */

const invertTargets = document.querySelectorAll(".nav-link");

invertTargets.forEach(target => {

  target.addEventListener("mouseenter", () => {
    document.documentElement.classList.add("invert-click");
  });

  target.addEventListener("mouseleave", () => {
    document.documentElement.classList.remove("invert-click");
  });

});

/* Credit ripple */

function setupRipple(selector, activeClass) {
  const credit = document.querySelector(selector);
  if (!credit) return;

  const text = credit.textContent.trim();
  credit.innerHTML = "";

  [...text].forEach(char => {
    const span = document.createElement("span");
    span.textContent = char === " " ? "\u00A0" : char;
    span.className = activeClass;
    credit.appendChild(span);
  });

  const letters = credit.querySelectorAll(`.${activeClass}`);

  function ripple() {
    letters.forEach((letter, index) => {
      setTimeout(() => {
        letter.classList.add("active");

        setTimeout(() => {
          letter.classList.remove("active");
        }, 1550);
      }, index * 55);
    });
  }

  ripple();
  setInterval(ripple, 4000);
}

setupRipple(".font-credit-bianzhidai", "font-credit-letter");
setupRipple(".font-credit-anthony", "font-credit-letter-anthony");

</script>
