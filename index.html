<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/png" href="favicon.png">

<title>Erik Mettävainio</title>

<style>
@font-face {
  font-family: "Bianzhidai";
  src: url("assets/fonts/bianzhidai.otf") format("opentype");
}

@font-face {
  font-family: "Anthony";
  src: url("assets/fonts/Anthony.otf") format("opentype");
}

@font-face {
  font-family: "HelveticaCustom";
  src: url("assets/fonts/helveticaneue-light.woff2") format("woff2");
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  background: white;
  transition: filter 0.15s ease;
}

html.invert-click {
  filter: invert(1);
}

body {
  background: white;
  color: black;
  font-family: "HelveticaCustom", Helvetica, Arial, sans-serif;
  font-weight: 300;
  overflow: hidden;
}

.home-page {
  width: 100vw;
  height: 100vh;
  position: relative;
}

/* BACKGROUND */

.gradient-background {
  position: fixed;
  inset: 0;
  display: flex;
  overflow: hidden;
  z-index: 0;
  pointer-events: none;
}

.gradient-band {
  flex: 1;
  height: 100%;
  overflow: hidden;
  position: relative;
}

.gradient-band::before {
  content: "";
  position: absolute;
  left: 0;
  top: -100%;
  width: 100%;
  height: 300%;
  background: linear-gradient(
    to bottom,
    #000 0%,
    #fff 50%,
    #000 100%
  );
  transform: translateY(var(--shift));
  will-change: transform;
}

/* NAVIGATION */

.nav-link {
  position: absolute;
  z-index: 2;
  color: black;
  text-decoration: none;
  font-size: 52px;
  font-weight: 300;
  line-height: 1;
  transition: opacity .2s ease;
}

.nav-link:hover {
  opacity: .6;
}

.tilde {
  font-family: "Bianzhidai", monospace;
  font-size: 32px;
  margin-right: 4px;
  vertical-align: 5px;
}

.font-react-letter {
  display: inline-block;
  transition: font-family 0.08s ease;
}

.font-react-letter.touched-bianzhidai {
  font-family: "Bianzhidai", monospace;
}

.font-react-letter.touched-anthony {
  font-family: "Anthony", serif;
}

/* CREDIT */

.font-credit {
  position: fixed;
  bottom: 20px;
  font-size: 8px;
  line-height: 1;
  color: black;
  z-index: 10;
}

.font-credit-bianzhidai {
  right: 24px;
}

.font-credit-anthony {
  left: 24px;
}

.font-credit-letter {
  display: inline-block;
  transition: font-family 0.12s ease;
}

.font-credit-bianzhidai .font-credit-letter.active {
  font-family: "Bianzhidai", monospace;
}

.font-credit-anthony .font-credit-letter.active {
  font-family: "Anthony", serif;
}

.font-credit-letter.active {
  font-family: "Bianzhidai", monospace;
}

.font-credit-letter-anthony.active {
  font-family: "Anthony", serif;
}

/* MOBILE */

@media (max-width: 700px) {
  body {
    overflow: hidden;
  }

  .home-page {
    width: 100vw;
    height: 100vh;
    position: relative;
  }

  .nav-link {
    position: absolute;
    font-size: 32px;
    margin-bottom: 0;
  }

  .tilde {
    font-size: 24px;
    vertical-align: 3px;
  }

  .font-credit {
    font-size: 7px;
    bottom: 14px;
  }

  .font-credit-bianzhidai {
    right: 14px;
  }

  .font-credit-anthony {
    left: 14px;
  }
}
</style>
</head>

<body>

<main class="home-page">

  <div class="gradient-background" id="gradientBackground"></div>

  <a class="nav-link" href="about.html"><span class="tilde">~</span>About</a>
  <a class="nav-link" href="contact.html"><span class="tilde">~</span>Contact</a>
  <a class="nav-link" href="releases.html"><span class="tilde">~</span>Releases</a>
  <a class="nav-link" href="commissions.html"><span class="tilde">~</span>Commissions</a>
  <a class="nav-link" href="live.html"><span class="tilde">~</span>Live</a>

  <p class="font-credit font-credit-anthony">
    ANTHONY FONT MADE BY ANTHONY CARO
  </p>

  <p class="font-credit font-credit-bianzhidai">
    BIANZHIDAI FONT MADE BY XIAOYUAN GAO
  </p>

</main>

<script>
const bandCount = 8;
const gradientBackground = document.getElementById("gradientBackground");
const gradientBands = [];

let backgroundMouseX = window.innerWidth / 2;
let backgroundMouseY = window.innerHeight / 2;
const hasFinePointer = window.matchMedia("(hover: hover) and (pointer: fine)").matches;

for (let i = 0; i < bandCount; i++) {
  const band = document.createElement("div");
  band.className = "gradient-band";
  gradientBackground.appendChild(band);

  gradientBands.push({
    element: band,
    currentShift: 0
  });
}

window.addEventListener("mousemove", (e) => {
  if (!hasFinePointer) return;

  backgroundMouseX = e.clientX;
  backgroundMouseY = e.clientY;
});

function animateGradientBackground(time) {
  const width = window.innerWidth;
  const height = window.innerHeight;
  const bandWidth = width / bandCount;

  gradientBands.forEach((band, i) => {
    const base = i % 2 === 0 ? -height * 0.25 : height * 0.25;
    let targetShift;

    if (hasFinePointer) {
      const bandCenterX = i * bandWidth + bandWidth / 2;
      const distanceX = Math.abs(backgroundMouseX - bandCenterX);
      const influence = Math.max(0, 1 - distanceX / 280);

      const distanceY = backgroundMouseY - height / 2;
      const repel = -distanceY * influence * 1.1;

      targetShift = base + repel;
    } else {
      const wave = Math.sin(time * 0.0007 + i * 0.9) * height * 0.18;
      targetShift = base + wave;
    }

    band.currentShift += (targetShift - band.currentShift) * 0.08;

    band.element.style.setProperty(
      "--shift",
      `${band.currentShift}px`
    );
  });

  requestAnimationFrame(animateGradientBackground);
}

requestAnimationFrame(animateGradientBackground);

const links = document.querySelectorAll(".nav-link");

/* Wrap visible nav text in letter spans */

links.forEach(link => {
  const textNodes = [];

  const walker = document.createTreeWalker(
    link,
    NodeFilter.SHOW_TEXT,
    null
  );

  while (walker.nextNode()) {
    textNodes.push(walker.currentNode);
  }

  textNodes.forEach(node => {
    const fragment = document.createDocumentFragment();

    [...node.textContent].forEach(char => {
      const span = document.createElement("span");
      span.textContent = char;
      span.className = "font-react-letter";
      fragment.appendChild(span);
    });

    node.replaceWith(fragment);
  });
});

/* Floating/random nav */

const desktopZones = [
  { x: 18, y: 18 },
  { x: 62, y: 18 },
  { x: 14, y: 62 },
  { x: 58, y: 66 },
  { x: 42, y: 82 }
];

const mobileZones = [
  { x: 8, y: 14 },
  { x: 52, y: 18 },
  { x: 10, y: 58 },
  { x: 48, y: 64 },
  { x: 28, y: 82 }
];

function shuffle(array) {
  return array.sort(() => Math.random() - 0.5);
}

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

const isMobile = window.innerWidth <= 700;
const activeZones = isMobile ? mobileZones : desktopZones;
const shuffledZones = shuffle([...activeZones]);

if (isMobile) {
  links.forEach((link, index) => {
    const zone = shuffledZones[index];

    const x = zone.x + (Math.random() * 8 - 4);
    const y = zone.y + (Math.random() * 6 - 3);

    link.style.left = x + "vw";
    link.style.top = y + "vh";
    link.style.transform = "none";
  });
} else {
  const movers = [];

  links.forEach((link, index) => {
    const zone = shuffledZones[index];

    const x = (zone.x + (Math.random() * 12 - 6)) / 100 * window.innerWidth;
    const y = (zone.y + (Math.random() * 10 - 5)) / 100 * window.innerHeight;

    movers.push({
      element: link,
      x,
      y,
      vx: (Math.random() - 0.5) * 0.25,
      vy: (Math.random() - 0.5) * 0.25,
      rotation: Math.random() * 8 - 4,
      vr: (Math.random() - 0.5) * 0.025
    });
  });

  function animate() {
    movers.forEach(item => {
      const rect = item.element.getBoundingClientRect();

      item.x += item.vx;
      item.y += item.vy;
      item.rotation += item.vr;

      if (item.x <= 0 || item.x + rect.width >= window.innerWidth) {
        item.vx *= -1;
      }

      if (item.y <= 0 || item.y + rect.height >= window.innerHeight) {
        item.vy *= -1;
      }

      item.x = clamp(item.x, 0, window.innerWidth - rect.width);
      item.y = clamp(item.y, 0, window.innerHeight - rect.height);

      item.element.style.left = item.x + "px";
      item.element.style.top = item.y + "px";
      item.element.style.transform = `rotate(${item.rotation}deg)`;
    });

    requestAnimationFrame(animate);
  }

  animate();
}

/* Font-react cursor effect */

const letters = document.querySelectorAll(".font-react-letter");
const radius = 70;
const reactiveFontClasses = ["touched-bianzhidai", "touched-anthony"];

document.addEventListener("mousemove", e => {
  letters.forEach(letter => {
    const rect = letter.getBoundingClientRect();

    const dx = e.clientX - (rect.left + rect.width / 2);
    const dy = e.clientY - (rect.top + rect.height / 2);
    const distance = Math.hypot(dx, dy);
    const isTouched = distance < radius;

    if (isTouched && !letter.dataset.reactiveFont) {
      const chosenClass = Math.random() < 0.5
        ? "touched-bianzhidai"
        : "touched-anthony";

      letter.dataset.reactiveFont = chosenClass;
      letter.classList.add(chosenClass);
    }

    if (!isTouched && letter.dataset.reactiveFont) {
      letter.classList.remove(letter.dataset.reactiveFont);
      delete letter.dataset.reactiveFont;
    }
  });
});

/* Click invert */

const invertTargets = document.querySelectorAll(".nav-link");

invertTargets.forEach(target => {

  target.addEventListener("mouseenter", () => {
    document.documentElement.classList.add("invert-click");
  });

  target.addEventListener("mouseleave", () => {
    document.documentElement.classList.remove("invert-click");
  });

});

/* Credit ripple */

function setupRipple(selector, activeClass) {
  const credit = document.querySelector(selector);
  if (!credit) return;

  const text = credit.textContent.trim();
  credit.innerHTML = "";

  [...text].forEach(char => {
    const span = document.createElement("span");
    span.textContent = char === " " ? "\u00A0" : char;
    span.className = activeClass;
    credit.appendChild(span);
  });

  const letters = credit.querySelectorAll(`.${activeClass}`);

  function ripple() {
    letters.forEach((letter, index) => {
      setTimeout(() => {
        letter.classList.add("active");

        setTimeout(() => {
          letter.classList.remove("active");
        }, 1550);
      }, index * 55);
    });
  }

  ripple();
  setInterval(ripple, 4000);
}

setupRipple(".font-credit-bianzhidai", "font-credit-letter");
setupRipple(".font-credit-anthony", "font-credit-letter-anthony");

</script>

</body>
</html>
