<script>
/* Optimized circle-to-square background: static grid + small dirty region. */
const canvas = document.getElementById("shapeCanvas");
const ctx = canvas.getContext("2d", { alpha: false });
const CELL = 20;
const INFLUENCE_RADIUS = 190;
const SHAPE_COLOR = "#999999";
const BACKGROUND_COLOR = "#ffffff";
const pointer = { x: -10000, y: -10000, active: false };
const staticCanvas = document.createElement("canvas");
const staticCtx = staticCanvas.getContext("2d", { alpha: false });
let width, height, columns, rows, dpr, morph, dirty = null, framePending = false;

function drawShape(context, x, y, radius) {
  const r = radius, right = x + CELL, bottom = y + CELL;
  context.moveTo(x + r, y);
  context.lineTo(right - r, y);
  context.quadraticCurveTo(right, y, right, y + r);
  context.lineTo(right, bottom - r);
  context.quadraticCurveTo(right, bottom, right - r, bottom);
  context.lineTo(x + r, bottom);
  context.quadraticCurveTo(x, bottom, x, bottom - r);
  context.lineTo(x, y + r);
  context.quadraticCurveTo(x, y, x + r, y);
  context.closePath();
}

function resizeGrid() {
  width = window.innerWidth;
  height = window.innerHeight;
  // One canvas pixel per CSS pixel keeps the background light on high-DPI screens.
  dpr = 1;
  canvas.width = staticCanvas.width = Math.ceil(width * dpr);
  canvas.height = staticCanvas.height = Math.ceil(height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  staticCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  columns = Math.ceil(width / CELL);
  rows = Math.ceil(height / CELL);
  morph = new Float32Array(columns * rows);
  staticCtx.fillStyle = BACKGROUND_COLOR;
  staticCtx.fillRect(0, 0, width, height);
  staticCtx.fillStyle = SHAPE_COLOR;
  staticCtx.beginPath();
  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < columns; col++) {
      drawShape(staticCtx, col * CELL, row * CELL, CELL / 2);
    }
  }
  staticCtx.fill();
  ctx.drawImage(staticCanvas, 0, 0);
  dirty = null;
  requestDraw();
}

function pointerRegion() {
  if (!pointer.active) return null;
  return {
    left: Math.max(0, Math.floor((pointer.x - INFLUENCE_RADIUS) / CELL)),
    top: Math.max(0, Math.floor((pointer.y - INFLUENCE_RADIUS) / CELL)),
    right: Math.min(columns - 1, Math.floor((pointer.x + INFLUENCE_RADIUS) / CELL)),
    bottom: Math.min(rows - 1, Math.floor((pointer.y + INFLUENCE_RADIUS) / CELL))
  };
}

function requestDraw() {
  if (!framePending) {
    framePending = true;
    requestAnimationFrame(drawGrid);
  }
}

function drawGrid() {
  framePending = false;
  const region = pointerRegion();
  if (!region && !dirty) return;
  // Redraw only the previous and current cursor areas, not the entire screen.
  const area = dirty && region ? {
    left: Math.min(dirty.left, region.left),
    top: Math.min(dirty.top, region.top),
    right: Math.max(dirty.right, region.right),
    bottom: Math.max(dirty.bottom, region.bottom)
  } : (dirty || region);
  const x = area.left * CELL, y = area.top * CELL;
  const w = Math.min(width - x, (area.right - area.left + 1) * CELL);
  const h = Math.min(height - y, (area.bottom - area.top + 1) * CELL);
  ctx.drawImage(staticCanvas, x, y, w, h, x, y, w, h);
  ctx.fillStyle = SHAPE_COLOR;
  ctx.beginPath();
  let stillMoving = false;
  let nextDirty = null;
  for (let row = area.top; row <= area.bottom; row++) {
    for (let col = area.left; col <= area.right; col++) {
      const index = row * columns + col;
      let target = 0;
      if (region && col >= region.left && col <= region.right && row >= region.top && row <= region.bottom) {
        const dx = (col + 0.5) * CELL - pointer.x;
        const dy = (row + 0.5) * CELL - pointer.y;
        const proximity = Math.max(0, 1 - Math.sqrt(dx * dx + dy * dy) / INFLUENCE_RADIUS);
        target = proximity * proximity * (3 - 2 * proximity);
      }
      let value = morph[index];
      if (Math.abs(target - value) > 0.004) {
        value += (target - value) * 0.24;
        stillMoving = true;
      } else {
        value = target;
      }
      morph[index] = value;
      if (value > 0.001) {
        drawShape(ctx, col * CELL, row * CELL, CELL * 0.5 * (1 - value));
        if (!nextDirty) nextDirty = { left: col, right: col, top: row, bottom: row };
        else {
          nextDirty.left = Math.min(nextDirty.left, col);
          nextDirty.right = Math.max(nextDirty.right, col);
          nextDirty.top = Math.min(nextDirty.top, row);
          nextDirty.bottom = Math.max(nextDirty.bottom, row);
        }
      }
    }
  }
  ctx.fill();
  dirty = nextDirty;
  if (stillMoving) requestDraw();
}

window.addEventListener("resize", resizeGrid);
window.addEventListener("pointermove", e => {
  pointer.x = e.clientX;
  pointer.y = e.clientY;
  pointer.active = true;
  requestDraw();
}, { passive: true });
window.addEventListener("pointerleave", () => { pointer.active = false; requestDraw(); });
window.addEventListener("pointercancel", () => { pointer.active = false; requestDraw(); });
resizeGrid();

const links = document.querySelectorAll(".nav-link");

/* Wrap visible nav text in letter spans */

links.forEach(link => {
  const textNodes = [];

  const walker = document.createTreeWalker(
    link,
    NodeFilter.SHOW_TEXT,
    null
  );

  while (walker.nextNode()) {
    textNodes.push(walker.currentNode);
  }

  textNodes.forEach(node => {
    const fragment = document.createDocumentFragment();

    [...node.textContent].forEach(char => {
      const span = document.createElement("span");
      span.textContent = char;
      span.className = "font-react-letter";
      fragment.appendChild(span);
    });

    node.replaceWith(fragment);
  });
});

/* Floating/random nav */

const desktopZones = [
  { x: 18, y: 18 },
  { x: 62, y: 18 },
  { x: 14, y: 62 },
  { x: 58, y: 66 },
  { x: 42, y: 82 }
];

const mobileZones = [
  { x: 8, y: 14 },
  { x: 52, y: 18 },
  { x: 10, y: 58 },
  { x: 48, y: 64 },
  { x: 28, y: 82 }
];

function shuffle(array) {
  return array.sort(() => Math.random() - 0.5);
}

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

const isMobile = window.innerWidth <= 700;
const activeZones = isMobile ? mobileZones : desktopZones;
const shuffledZones = shuffle([...activeZones]);

if (isMobile) {
  links.forEach((link, index) => {
    const zone = shuffledZones[index];

    const x = zone.x + (Math.random() * 8 - 4);
    const y = zone.y + (Math.random() * 6 - 3);

    link.style.left = x + "vw";
    link.style.top = y + "vh";
    link.style.transform = "none";
  });
} else {
  const movers = [];

  links.forEach((link, index) => {
    const zone = shuffledZones[index];

    const x = (zone.x + (Math.random() * 12 - 6)) / 100 * window.innerWidth;
    const y = (zone.y + (Math.random() * 10 - 5)) / 100 * window.innerHeight;

    movers.push({
      element: link,
      x,
      y,
      vx: (Math.random() - 0.5) * 0.25,
      vy: (Math.random() - 0.5) * 0.25,
      rotation: Math.random() * 8 - 4,
      vr: (Math.random() - 0.5) * 0.025
    });
  });

  function animate() {
    movers.forEach(item => {
      const rect = item.element.getBoundingClientRect();

      item.x += item.vx;
      item.y += item.vy;
      item.rotation += item.vr;

      if (item.x <= 0 || item.x + rect.width >= window.innerWidth) {
        item.vx *= -1;
      }

      if (item.y <= 0 || item.y + rect.height >= window.innerHeight) {
        item.vy *= -1;
      }

      item.x = clamp(item.x, 0, window.innerWidth - rect.width);
      item.y = clamp(item.y, 0, window.innerHeight - rect.height);

      item.element.style.left = item.x + "px";
      item.element.style.top = item.y + "px";
      item.element.style.transform = `rotate(${item.rotation}deg)`;
    });

    requestAnimationFrame(animate);
  }

  animate();
}

/* Font-react cursor effect */

const letters = document.querySelectorAll(".font-react-letter");
const radius = 70;
const reactiveFontClasses = ["touched-bianzhidai", "touched-anthony"];

document.addEventListener("mousemove", e => {
  letters.forEach(letter => {
    const rect = letter.getBoundingClientRect();

    const dx = e.clientX - (rect.left + rect.width / 2);
    const dy = e.clientY - (rect.top + rect.height / 2);
    const distance = Math.hypot(dx, dy);
    const isTouched = distance < radius;

    if (isTouched && !letter.dataset.reactiveFont) {
      const chosenClass = Math.random() < 0.5
        ? "touched-bianzhidai"
        : "touched-anthony";

      letter.dataset.reactiveFont = chosenClass;
      letter.classList.add(chosenClass);
    }

    if (!isTouched && letter.dataset.reactiveFont) {
      letter.classList.remove(letter.dataset.reactiveFont);
      delete letter.dataset.reactiveFont;
    }
  });
});

/* Click invert */

const invertTargets = document.querySelectorAll(".nav-link");

invertTargets.forEach(target => {

  target.addEventListener("mouseenter", () => {
    document.documentElement.classList.add("invert-click");
  });

  target.addEventListener("mouseleave", () => {
    document.documentElement.classList.remove("invert-click");
  });

});

/* Credit ripple */

function setupRipple(selector, activeClass) {
  const credit = document.querySelector(selector);
  if (!credit) return;

  const text = credit.textContent.trim();
  credit.innerHTML = "";

  [...text].forEach(char => {
    const span = document.createElement("span");
    span.textContent = char === " " ? "\u00A0" : char;
    span.className = activeClass;
    credit.appendChild(span);
  });

  const letters = credit.querySelectorAll(`.${activeClass}`);

  function ripple() {
    letters.forEach((letter, index) => {
      setTimeout(() => {
        letter.classList.add("active");

        setTimeout(() => {
          letter.classList.remove("active");
        }, 1550);
      }, index * 55);
    });
  }

  ripple();
  setInterval(ripple, 4000);
}

setupRipple(".font-credit-bianzhidai", "font-credit-letter");
setupRipple(".font-credit-anthony", "font-credit-letter-anthony");

</script>
